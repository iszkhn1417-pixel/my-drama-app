<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドラマ・映画 視聴管理</title>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --accent: #e0a96d;
      --accent-hover: #d09455;
      --text: #333333;
      --sub-text: #777777;
      --border: #e8e2d5;
      --header-bg: #f5efe6;
      --unread-red: #d9534f;
      --today-bg: #fff9e6;
      --today-accent: #e67e22;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 75px;
    }

    header {
      background-color: var(--header-bg);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.0rem;
      margin: 0;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .btn-login {
      background-color: #4285f4;
      color: white;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .btn-logout {
      background-color: #a09e98;
      color: white;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    /* 画面の幅を広げて余白を有効活用 */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--text);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .input-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #faf8f5;
      color: var(--text);
      font-size: 0.95rem;
    }

    .btn-group { display: flex; gap: 8px; }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    button.btn-block { width: 100%; }
    button.btn-secondary { background-color: #a09e98; }

    .search-input-wrapper { display: flex; gap: 8px; }

    .suggestions {
      border: 1px solid var(--border);
      background: white;
      border-radius: 8px;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 0.9rem; }
    .suggestion-item:hover { background-color: #f5efe6; }

    .selected-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .tag {
      background-color: #f0e8db;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: #faf8f5;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .checkbox-item { display: flex; align-items: center; gap: 4px; font-size: 0.9rem; }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      background: #faf8f5;
      padding: 8px;
      border-radius: 8px;
    }

    .schedule-item .ep-label { font-size: 0.85rem; font-weight: bold; min-width: 42px; }
    .schedule-item input[type="date"] { flex: 2; }
    .schedule-item select { flex: 1.5; }

    .schedule-item .skip-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      padding: 6px 8px;
      white-space: nowrap;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--sub-text);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .nav-item.active { color: var(--accent); font-weight: bold; }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar-day-header { font-size: 0.85rem; font-weight: bold; color: var(--sub-text); padding: 6px 0; }

    /* カレンダーマスの拡大（PC/大きな画面用） */
    .calendar-cell {
      min-height: 110px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s;
    }

    /* 今日の日付の特別デザイン */
    .calendar-cell.is-today {
      background-color: var(--today-bg) !important;
      border: 2px solid var(--today-accent) !important;
    }

    .calendar-date-num {
      font-size: 0.8rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 50%;
    }

    .calendar-cell.is-today .calendar-date-num {
      background-color: var(--today-accent);
      color: #ffffff;
    }

    .calendar-event {
      background-color: #f0e8db;
      color: var(--text);
      border-radius: 4px;
      padding: 3px 6px;
      margin-top: 3px;
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .calendar-event.unread { background-color: var(--unread-red); color: white; }

    /* スマホ等画面が狭い場合調整 */
    @media (max-width: 600px) {
      .calendar-cell {
        min-height: 75px;
      }
      .calendar-event {
        font-size: 0.65rem;
        padding: 2px 3px;
      }
    }

    .sync-status {
      font-size: 0.75rem;
      color: #888;
      text-align: right;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">📅 カレンダー</h1>
    <div id="auth-container">
      <button class="btn-login" onclick="loginWithGoogle()">Googleでログイン</button>
    </div>
  </header>

  <div class="container">
    <div id="sync-indicator" class="sync-status">オフライン（端末に保存中）</div>

    <!-- 1. 📝 登録タブ -->
    <div id="tab-register" class="tab-content">
      <div class="card">
        <h2 id="form-title">新しいドラマ・映画を追加</h2>
        <form id="drama-form">
          <input type="hidden" id="edit-id">

          <div class="input-group">
            <label>ドラマ名 / 作品名 *</label>
            <div class="search-input-wrapper">
              <input type="text" id="title" required placeholder="例: VIVANT">
              <button type="button" onclick="searchNetWork()" style="white-space: nowrap;">🔍 検索</button>
            </div>
          </div>

          <div class="input-group">
            <label>出演俳優 (1文字で候補検索)</label>
            <input type="text" id="actor-input" placeholder="俳優名を入力して検索..." oninput="filterActors()">
            <div id="actor-suggestions" class="suggestions" style="display:none;"></div>
            <div id="selected-actors" class="selected-tags"></div>
          </div>

          <div class="input-group">
            <label>放送局</label>
            <select id="station"></select>
          </div>

          <div class="input-group">
            <label>脚本</label>
            <select id="writer"></select>
          </div>

          <div class="input-group">
            <label>監督</label>
            <select id="director"></select>
          </div>

          <div class="input-group">
            <label>放送開始日 & 曜日</label>
            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="date" id="start-date" required onchange="updateDayOfWeek()">
              <span id="day-of-week" style="font-weight: bold; min-width: 45px;">(曜)</span>
            </div>
          </div>

          <div class="input-group">
            <label>放送開始時刻</label>
            <input type="time" id="start-time" required>
          </div>

          <div class="input-group">
            <label>所要時間</label>
            <select id="duration"></select>
          </div>

          <div class="input-group">
            <label>配信サービス (複数選択可)</label>
            <div id="services-checkboxes" class="checkbox-group"></div>
          </div>

          <div class="input-group">
            <label>最終話の日付 (空欄可・自動計算)</label>
            <input type="date" id="final-date">
          </div>

          <div class="input-group">
            <label>話数 (入力すると下にスケジュール生成)</label>
            <input type="number" id="episode-count" min="1" max="50" placeholder="例: 10" onchange="generateSchedules()">
          </div>

          <div class="input-group">
            <label>各話スケジュール調整 (⏭️ 休止で1週繰越)</label>
            <div id="schedule-container"></div>
          </div>

          <div class="btn-group" style="margin-top: 20px;">
            <button type="submit" class="btn-block">保存する</button>
            <button type="button" class="btn-secondary btn-block" onclick="resetForm()">リセット</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 2. ✅ タスクタブ -->
    <div id="tab-tasks" class="tab-content">
      <div class="card">
        <h2>未視聴の放送済みドラマ</h2>
        <div id="task-list"></div>
      </div>
    </div>

    <!-- 3. 📅 カレンダータブ (ホーム) -->
    <div id="tab-calendar" class="tab-content active">
      <div class="card">
        <div class="calendar-header">
          <button type="button" onclick="changeMonth(-1)">◀ 前月</button>
          <h3 id="calendar-month-title" style="margin: 0;">2026年 10月</h3>
          <button type="button" onclick="changeMonth(1)">次月 ▶</button>
        </div>
        <div class="calendar-grid">
          <div class="calendar-day-header" style="color:red;">日</div>
          <div class="calendar-day-header">月</div>
          <div class="calendar-day-header">火</div>
          <div class="calendar-day-header">水</div>
          <div class="calendar-day-header">木</div>
          <div class="calendar-day-header">金</div>
          <div class="calendar-day-header" style="color:blue;">土</div>
        </div>
        <div id="calendar-grid-cells" class="calendar-grid"></div>
      </div>
    </div>

    <!-- 4. ★ 履歴タブ -->
    <div id="tab-history" class="tab-content">
      <div class="card">
        <h2>完了作品の検索</h2>
        <input type="text" id="history-search" placeholder="🔍 タイトル・放送局・俳優名で検索..." oninput="renderHistory()">
      </div>
      <div class="card">
        <h2>視聴完了リスト</h2>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- 5. ⚙️ 設定タブ -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h2>選択肢のカスタマイズ登録</h2>
        <div class="input-group">
          <label>出演俳優の追加</label>
          <div class="search-input-wrapper">
            <input type="text" id="add-actor-input" placeholder="例: 小栗旬" onkeypress="handleEnter(event, 'actors')">
            <button type="button" onclick="addMasterItem('actors')">追加</button>
          </div>
        </div>
        <div class="input-group">
          <label>放送局の追加</label>
          <div class="search-input-wrapper">
            <input type="text" id="add-station-input" placeholder="例: TBS" onkeypress="handleEnter(event, 'stations')">
            <button type="button" onclick="addMasterItem('stations')">追加</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="switchTab('register')"><div>📝</div><div>登録</div></div>
    <div class="nav-item" onclick="switchTab('tasks')"><div>✅</div><div>タスク</div></div>
    <div class="nav-item active" onclick="switchTab('calendar')"><div>📅</div><div>カレンダー</div></div>
    <div class="nav-item" onclick="switchTab('history')"><div>★</div><div>履歴</div></div>
    <div class="nav-item" onclick="switchTab('settings')"><div>⚙️</div><div>設定</div></div>
  </nav>

  <script>
    // Firebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyB9OS_mGy9_4HDjw96Lm5e8jFNnc521NZs",
      authDomain: "my-drama-app-5ecbb.firebaseapp.com",
      projectId: "my-drama-app-5ecbb",
      storageBucket: "my-drama-app-5ecbb.firebasestorage.app",
      messagingSenderId: "1084781881966",
      appId: "1:1084781881966:web:bd7f192d45af26e724d47f"
    };

    let db = null;
    let auth = null;
    let currentUser = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch(e) {
      console.log("Firebase連携エラー:", e);
    }

    const defaultMaster = {
      actors: ["堺雅人", "阿部寛", "二宮和也", "長澤まさみ", "新垣結衣", "小栗旬"],
      stations: ["TBS", "フジテレビ", "日本テレビ", "テレビ朝日", "テレビ東京", "NHK"],
      writers: ["福田靖", "野木亜紀子", "三谷幸喜", "坂元裕二"],
      directors: ["福澤克雄", "塚原あゆ子"],
      services: ["TVer", "Netflix", "U-NEXT", "Amazonプライム", "Hulu", "Disney+"],
      durations: ["30分", "45分", "60分", "90分", "120分"]
    };

    let masterData = JSON.parse(localStorage.getItem('drama_master_data')) || defaultMaster;
    let dramaList = JSON.parse(localStorage.getItem('drama_app_items')) || [];
    let currentSelectedActors = [];
    let currentSchedules = [];
    let calendarDate = new Date();

    if (auth) {
      auth.onAuthStateChanged(user => {
        currentUser = user;
        const authContainer = document.getElementById('auth-container');
        const syncIndicator = document.getElementById('sync-indicator');

        if (user) {
          authContainer.innerHTML = `
            <div class="user-profile">
              <img src="${user.photoURL}" class="user-avatar" title="${user.displayName}">
              <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
          `;
          syncIndicator.innerText = `🟢 クラウド同期中 (${user.displayName})`;
          loadFromCloud();
        } else {
          authContainer.innerHTML = `<button class="btn-login" onclick="loginWithGoogle()">Googleでログイン</button>`;
          syncIndicator.innerText = `⚪ オフライン（端末保存）`;
        }
      });
    }

    function loginWithGoogle() {
      if (!auth) return;
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        alert("ログインに失敗しました: " + error.message);
      });
    }

    function logout() {
      if (auth) auth.signOut();
    }

    function saveData() {
      localStorage.setItem('drama_master_data', JSON.stringify(masterData));
      localStorage.setItem('drama_app_items', JSON.stringify(dramaList));

      if (currentUser && db) {
        db.collection('users').doc(currentUser.uid).set({
          masterData: masterData,
          dramaList: dramaList,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => console.error("クラウド保存エラー:", err));
      }
    }

    function loadFromCloud() {
      if (!currentUser || !db) return;
      db.collection('users').doc(currentUser.uid).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data.dramaList) dramaList = data.dramaList;
          if (data.masterData) masterData = data.masterData;
          saveData();
          renderCalendar();
          renderTasks();
          renderHistory();
          renderMasterOptions();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderMasterOptions();
      resetForm();
      renderCalendar();
      renderTasks();
      renderHistory();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      const targetTab = document.getElementById(`tab-${tabName}`);
      if (targetTab) targetTab.classList.add('active');

      const titles = {
        register: "📝 ドラマ登録・編集",
        tasks: "✅ 未視聴タスク",
        calendar: "📅 カレンダー",
        history: "★ 視聴履歴",
        settings: "⚙️ 設定"
      };
      document.getElementById('header-title').innerText = titles[tabName] || "ドラマ管理";

      const navIndices = { register: 0, tasks: 1, calendar: 2, history: 3, settings: 4 };
      const navItems = document.querySelectorAll('.nav-item');
      if (navItems[navIndices[tabName]]) navItems[navIndices[tabName]].classList.add('active');

      if (tabName === 'calendar') renderCalendar();
      if (tabName === 'tasks') renderTasks();
      if (tabName === 'history') renderHistory();
    }

    function searchNetWork() {
      const title = document.getElementById('title').value.trim();
      if (!title) return alert("ドラマ名を入力してください。");
      window.open(`https://www.google.com/search?q=${encodeURIComponent('ドラマ ' + title)}`, '_blank');
    }

    function updateDayOfWeek() {
      const dateVal = document.getElementById('start-date').value;
      if (!dateVal) return;
      const days = ["(日)", "(月)", "(火)", "(水)", "(木)", "(金)", "(土)"];
      document.getElementById('day-of-week').innerText = days[new Date(dateVal).getDay()];
      if (currentSchedules.length === 0) generateSchedules();
    }

    function filterActors() {
      const input = document.getElementById('actor-input').value.toLowerCase().trim();
      const container = document.getElementById('actor-suggestions');
      container.innerHTML = '';
      if (!input) return container.style.display = 'none';

      const filtered = masterData.actors.filter(actor => 
        actor.toLowerCase().includes(input) && !currentSelectedActors.includes(actor)
      );
      if (filtered.length === 0) return container.style.display = 'none';

      filtered.forEach(actor => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerText = actor;
        div.onclick = () => selectActor(actor);
        container.appendChild(div);
      });
      container.style.display = 'block';
    }

    function selectActor(actor) {
      if (!currentSelectedActors.includes(actor)) {
        currentSelectedActors.push(actor);
        renderSelectedActors();
      }
      document.getElementById('actor-input').value = '';
      document.getElementById('actor-suggestions').style.display = 'none';
    }

    function removeActor(actor) {
      currentSelectedActors = currentSelectedActors.filter(a => a !== actor);
      renderSelectedActors();
    }

    function renderSelectedActors() {
      document.getElementById('selected-actors').innerHTML = currentSelectedActors.map(a => `
        <span class="tag">${a} <span onclick="removeActor('${a}')" style="cursor:pointer;">×</span></span>
      `).join('');
    }

    function generateSchedules() {
      const count = parseInt(document.getElementById('episode-count').value) || 0;
      const startDateStr = document.getElementById('start-date').value;
      if (!startDateStr || count <= 0) return;

      const baseDate = new Date(startDateStr);
      currentSchedules = [];

      for (let i = 1; i <= count; i++) {
        const epDate = new Date(baseDate);
        epDate.setDate(baseDate.getDate() + (i - 1) * 7);
        currentSchedules.push({
          episode: i,
          date: epDate.toISOString().split('T')[0],
          status: "視聴前"
        });
      }
      renderScheduleList();
      if (currentSchedules.length > 0) {
        document.getElementById('final-date').value = currentSchedules[currentSchedules.length - 1].date;
      }
    }

    function delayScheduleFrom(index) {
      for (let i = index; i < currentSchedules.length; i++) {
        if (currentSchedules[i].date) {
          const d = new Date(currentSchedules[i].date);
          d.setDate(d.getDate() + 7);
          currentSchedules[i].date = d.toISOString().split('T')[0];
        }
      }
      renderScheduleList();
      if (currentSchedules.length > 0) {
        document.getElementById('final-date').value = currentSchedules[currentSchedules.length - 1].date;
      }
    }

    function renderScheduleList() {
      const container = document.getElementById('schedule-container');
      container.innerHTML = currentSchedules.map((s, index) => `
        <div class="schedule-item">
          <span class="ep-label">${s.episode}話</span>
          <input type="date" value="${s.date}" onchange="updateScheduleDate(${index}, this.value)">
          <select onchange="updateScheduleStatus(${index}, this.value)">
            <option value="視聴前" ${s.status === '視聴前' ? 'selected' : ''}>視聴前</option>
            <option value="視聴中" ${s.status === '視聴中' ? 'selected' : ''}>視聴中</option>
            <option value="視聴済み" ${s.status === '視聴済み' ? 'selected' : ''}>視聴済み</option>
          </select>
          <button type="button" class="skip-btn" onclick="delayScheduleFrom(${index})" title="特番等でこの週を休止し繰り越す">⏭️ 休止</button>
        </div>
      `).join('');
    }

    function updateScheduleDate(index, val) {
      currentSchedules[index].date = val;
      if (index === currentSchedules.length - 1) document.getElementById('final-date').value = val;
    }

    function updateScheduleStatus(index, val) {
      currentSchedules[index].status = val;
    }

    document.getElementById('drama-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;
      const selectedServices = Array.from(document.querySelectorAll('.service-checkbox:checked')).map(cb => cb.value);

      const newItem = {
        id: editId ? parseInt(editId) : Date.now(),
        title: document.getElementById('title').value.trim(),
        actors: currentSelectedActors,
        station: document.getElementById('station').value,
        writer: document.getElementById('writer').value,
        director: document.getElementById('director').value,
        startDate: document.getElementById('start-date').value,
        startTime: document.getElementById('start-time').value,
        duration: document.getElementById('duration').value,
        services: selectedServices,
        finalDate: document.getElementById('final-date').value,
        schedules: currentSchedules,
        rating: editId ? (dramaList.find(d => d.id == editId)?.rating || 0) : 0,
        comment: editId ? (dramaList.find(d => d.id == editId)?.comment || "") : ""
      };

      if (editId) {
        const idx = dramaList.findIndex(d => d.id == editId);
        if (idx !== -1) dramaList[idx] = newItem;
      } else {
        dramaList.push(newItem);
      }

      saveData();
      alert('保存が完了しました！');
      resetForm();
      switchTab('calendar');
    });

    function resetForm() {
      document.getElementById('drama-form').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('form-title').innerText = '新しいドラマ・映画を追加';
      currentSelectedActors = [];
      currentSchedules = [];
      renderSelectedActors();
      document.getElementById('schedule-container').innerHTML = '';
      document.getElementById('day-of-week').innerText = '(曜)';
      document.querySelectorAll('.service-checkbox').forEach(cb => cb.checked = false);
    }

    function editDrama(id) {
      const item = dramaList.find(d => d.id === id);
      if (!item) return;

      switchTab('register');
      document.getElementById('form-title').innerText = 'ドラマの編集';
      document.getElementById('edit-id').value = item.id;
      document.getElementById('title').value = item.title;
      document.getElementById('station').value = item.station || '';
      document.getElementById('writer').value = item.writer || '';
      document.getElementById('director').value = item.director || '';
      document.getElementById('start-date').value = item.startDate;
      document.getElementById('start-time').value = item.startTime;
      document.getElementById('duration').value = item.duration || '';
      document.getElementById('final-date').value = item.finalDate || '';
      document.getElementById('episode-count').value = item.schedules ? item.schedules.length : '';

      currentSelectedActors = item.actors || [];
      renderSelectedActors();
      currentSchedules = item.schedules || [];
      renderScheduleList();

      document.querySelectorAll('.service-checkbox').forEach(cb => {
        cb.checked = (item.services || []).includes(cb.value);
      });
      updateDayOfWeek();
    }

    function renderTasks() {
      const container = document.getElementById('task-list');
      container.innerHTML = '';
      const now = new Date();
      let count = 0;

      dramaList.forEach(drama => {
        (drama.schedules || []).forEach((sched, index) => {
          if (!sched.date) return;
          const broadcastTime = new Date(`${sched.date}T${drama.startTime || '00:00'}`);
          if (now >= broadcastTime && sched.status !== '視聴済み') {
            count++;
            const item = document.createElement('div');
            item.className = 'card';
            item.style.marginBottom = '8px';
            item.innerHTML = `
              <div style="display: flex; gap: 10px;">
                <input type="checkbox" style="width: 20px; height: 20px;" onchange="markAsWatched(${drama.id}, ${index}, this.checked)">
                <div>
                  <div style="font-weight: bold;">${drama.title} (第${sched.episode}話)</div>
                  <div style="font-size: 0.85rem; color: var(--sub-text);">📅 ${sched.date} ${drama.startTime || ''}</div>
                </div>
              </div>
            `;
            container.appendChild(item);
          }
        });
      });
      if (count === 0) container.innerHTML = '<p style="text-align: center; color: var(--sub-text);">未視聴のタスクはありません！✨</p>';
    }

    function markAsWatched(dramaId, schedIndex, isChecked) {
      const drama = dramaList.find(d => d.id === dramaId);
      if (drama && drama.schedules[schedIndex]) {
        drama.schedules[schedIndex].status = isChecked ? '視聴済み' : '視聴前';
        saveData();
        renderTasks();
      }
    }

    function changeMonth(diff) {
      calendarDate.setMonth(calendarDate.getMonth() + diff);
      renderCalendar();
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;
      const grid = document.getElementById('calendar-grid-cells');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      // 今日の年月日判定用
      const today = new Date();
      const todayYear = today.getFullYear();
      const todayMonth = today.getMonth();
      const todayDate = today.getDate();

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        cell.style.background = '#f2efe9';
        grid.appendChild(cell);
      }

      const now = new Date();
      for (let date = 1; date <= lastDate; date++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell';

        // 今日かどうかを判定
        const isToday = (year === todayYear && month === todayMonth && date === todayDate);
        if (isToday) {
          cell.classList.add('is-today');
        }

        const dateNum = document.createElement('div');
        dateNum.className = 'calendar-date-num';
        dateNum.innerText = date;
        cell.appendChild(dateNum);

        const currentDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

        dramaList.forEach(drama => {
          (drama.schedules || []).forEach(sched => {
            if (sched.date === currentDateStr) {
              const ev = document.createElement('div');
              ev.className = 'calendar-event';
              ev.innerText = `${drama.title} (${sched.episode}話)`;
              const broadcastTime = new Date(`${sched.date}T${drama.startTime || '00:00'}`);
              if (now >= broadcastTime && sched.status !== '視聴済み') {
                ev.classList.add('unread');
              }
              ev.onclick = () => editDrama(drama.id);
              cell.appendChild(ev);
            }
          });
        });
        grid.appendChild(cell);
      }
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';
      const completed = dramaList.filter(d => (d.schedules || []).length > 0 && d.schedules[d.schedules.length - 1].status === '視聴済み');
      if (completed.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--sub-text);">完了した作品はありません。</p>';
        return;
      }
      completed.forEach(d => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div style="font-weight: bold;">🎬 ${d.title}</div>`;
        container.appendChild(card);
      });
    }

    function renderMasterOptions() {
      document.getElementById('station').innerHTML = `<option value="">指定なし</option>` + masterData.stations.map(s => `<option value="${s}">${s}</option>`).join('');
      document.getElementById('writer').innerHTML = `<option value="">指定なし</option>` + masterData.writers.map(w => `<option value="${w}">${w}</option>`).join('');
      document.getElementById('director').innerHTML = `<option value="">指定なし</option>` + masterData.directors.map(d => `<option value="${d}">${d}</option>`).join('');
      document.getElementById('duration').innerHTML = `<option value="">指定なし</option>` + masterData.durations.map(d => `<option value="${d}">${d}</option>`).join('');
      document.getElementById('services-checkboxes').innerHTML = masterData.services.map(s => `
        <label class="checkbox-item"><input type="checkbox" class="service-checkbox" value="${s}"> ${s}</label>
      `).join('');
    }

    function addMasterItem(type) {
      const inputEl = document.getElementById(`add-${type.slice(0,-1)}-input`);
      if (!inputEl) return;
      const val = inputEl.value.trim();
      if (val && !masterData[type].includes(val)) {
        masterData[type].push(val);
        saveData();
        renderMasterOptions();
        inputEl.value = '';
      }
    }

    function handleEnter(e, type) {
      if (e.key === 'Enter') { e.preventDefault(); addMasterItem(type); }
    }
  </script>
</body>
</html>
